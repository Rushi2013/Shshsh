tion Code\",\"codeEmailHint\",\"Enter 6-digit code sent to your email\",\"codeNewEmailLabel\",\"Authentication Code (New Email)\",\"codeNewEmailHint\",\"Enter 6-digit code sent to your new email\",\"codeAppLabel\",\"Authenticator App Code\",\"codeAppHint\",\"Enter 6-digit code from your Authenticator App\",\"codeSentToPrefix\",\"Enter 6-digit code sent to\",\"resendCode\",\"Send a new E-Mail code\",\"walletFirstTime\",\"You are using this wallet to sign in for the first time. Please enter your e-mail to continue.\",\"newsletterConsent\",\"I agree to receive product updates, tips, and special offers from LimeWire by email.\",\"closeWindow\",\"Close Window\",\"errorCodeRequired\",\"Authentication code is required.\",\"errorCodeLength\",\"The Authentication code is 6 characters long.\",\"errorEmailRequired\",\"Email is required.\",\"walletConnecting\",\"Initiating a connection to your wallet.\",\"walletTakesSeconds\",\"This can take a few seconds...\",\"walletNotConnected\",\"Wallet not connected.\",\"walletNotConnectedDetail\",\"We couldn't connect to your wallet, please make sure your wallet is connected to the site and is using the correct account.\",\"walletCheckWallet\",\"Please check your wallet.\",\"walletSignPrompt\",\"You will be asked to sign a message in order to authenticate. This won't cost any gas.\",\"walletNoSignature\",\"Signature not obtainable.\",\"walletNoSignatureDetail\",\"We couldn't obtain the signature from your wallet. You may have rejected the action in your wallet.\",\"walletVerifying\",\"Verifying your signature.\",\"button\",\"Language\",\"Choose your language\",\"apply\",\"LimeWire {terms} and {privacy} apply.\",\"recaptcha\",\"This site is protected by reCAPTCHA and the Google {privacy} and {terms} apply.\",\"googlePrivacy\",\"Privacy Policy\",\"googleTerms\",\"Terms of Service\",\"signIn\",\"Sign In\",\"createAccount\",\"Pricing\",\"tools\",\"about\",\"About LimeWire\",\"blog\",\"Blog\",\"helpCenter\",\"Help Center\",\"terms\",\"Terms \u0026 conditions\",\"privacy\",\"index\",\"Home\",\"buyLmwr\",\"mcpServer\",\"MCP Server\",\"history\",\"Our History\",\"research\",\"Open Research\",\"press\",\"Press\",\"writeForUs\",\"Write for Us\",\"userSubscription\",\"Subscription\",\"userPayments\",\"Payments\",\"userProfile\",\"My Profile\",\"userSettings\",\"Settings\",\"userFiles\",\"My Files\",\"descLimeWire\",\"Upload, edit \u0026 share files of any size\",\"descLmwr\",\"LimeWire ecosystem utility token\",\"descLimeWireNetwork\",\"Decentralized file storage network\",\"descLmwrScan\",\"Real-time LimeWire Network analytics\",\"lmwrToken\",\"LimeWire Token\",\"footerResources\",\"Resources\",\"footerCompany\",\"Company\",\"footerAccount\",\"Account\",\"footerTaglineBrand\",\"The New LimeWire.\",\"footerTaglineMotto\",\"Create. Collaborate. Share.\",\"menuProduct\",\"Product\",\"menuCommunity\",\"Community\",\"allTools\",\"All Tools\",\"support\",\"Support\",\"badgeNew\",\"New\",\"logoAlt\",\"LimeWire Logo\",\"avatarAlt\",\"User Avatar\",\"splashAlt\",\"LimeWire Splash Icon\",\"Pricing | LimeWire — File Sharing Plans\",\"Compare LimeWire plans: upload size, storage, how long files stay online and daily download limits. Start free, upgrade when you need more.\",\"LimeWire Pricing\",\"subtitle\",\"Share and store files with end-to-end encryption. Start on the free plan and upgrade only when you need bigger uploads, more storage or files that stay online longer.\",\"free\",\"Free\",\"perMonth\",\"/month\",\"billedYearly\",\"or {price} billed yearly\",\"saving\",\" — save {percent}%\",\"ctaFree\",\"ctaPaid\",\"Get {plan}\",\"note\",\"Prices are in US dollars. You can change or cancel your plan at any time in your account settings.\",\"faqHeading\",\"Frequently asked questions\",\"q1\",\"Can I share files without an account?\",\"a1\",\"Yes. You can upload and share a file without signing up, with the limits of the free plan. An account keeps your files in one place and raises the daily download limit.\",\"q2\",\"What happens to my files after they expire?\",\"a2\",\"Shared files stay online for the period shown on your plan and are then removed, so old links stop working. Paid plans keep files online longer and let you pin uploads that should never expire.\",\"q3\",\"Is there a download limit?\",\"a3\",\"Every plan has one. Each of your files can be downloaded a set number of times per day, and that number is listed on each plan above. All downloads of your files together also have a size limit per day and per month, listed on each plan too: the daily one resets at 00:00 UTC, the monthly one on the 1st of the month.\",\"q4\",\"Are my files encrypted?\",\"a4\",\"Yes, on every plan, including the free one. Files are encrypted and only someone with your link can open them.\",\"q5\",\"Can I cancel at any time?\",\"a5\",\"Yes. A plan can be changed or cancelled in your account settings, and no further payment is taken after that.\",\"tierFreeNote\",\"Share files once in a while\",\"tierFreeSendbigNote\",\"SendBig bonus: up to {size} per transfer\",\"tierProNote\",\"Share \u0026 edit big files regularly\",\"tierProPlusNote\",\"Share \u0026 store big files at scale\",\"featUpload\",\"Upload up to {size}\",\"featUploadFiles\",\"Upload up to {count} files a day\",\"featStorage\",\"{size} Storage\",\"featNeverExpire\",\"Files never expire\",\"featExpire\",\"Files expire after {period}\",\"featDownloads\",\"Each file can be downloaded up to {count} times a day\",\"featDownloadsTip\",\"Each of your files can be downloaded up to {count} times per day, with a total of {total} of downloads per month.\",\"featEgress\",\"Up to {daily} of Downloads Daily, {monthly} Monthly\",\"featEgressTip\",\"The total size of all downloads of your files. The daily limit resets at 00:00 UTC, the monthly one on the 1st of the month.\",\"featEncryption\",\"Full Encryption\",\"featTools\",\"File Editing Tools\",\"featPinned\",\"{count} Pinned Uploads\",\"featPinnedTip\",\"Pinned uploads always stay on top of your feed and never expire.\",\"unitDay\",\"{count} day\",\"unitDays\",\"{count} days\",\"unitMonth\",\"{count} month\",\"unitMonths\",\"{count} months\",\"What is LimeWire?\",\"LimeWire is a file sharing platform. You drop a file in, you get a link, you send the link — no software to install and no account needed to start. Alongside sharing it runs AI tools for images, video and documents. It is the same name as the peer-to-peer client of the 2000s and the same idea — moving files between people — rebuilt as a service that runs in a browser.\",\"Is LimeWire still around?\",\"Yes. LimeWire is live and in daily use: 131 million files have been shared through it and 7.6 petabytes uploaded. The original peer-to-peer network shut down in 2010; the name came back in 2022 as the file sharing and AI platform you are looking at now.\",\"Is LimeWire safe to use?\",\"Files are encrypted before they leave your device and stay encrypted in storage. If you share without an account, the key stays on your device and is carried in the link itself — so nobody, including us, can open the file without the link you sent. There is nothing to install, so there is no installer to pick up anything on the way.\",\"Do I need an account to share a file?\",\"No. Without an account you can send up to 10 GB at a time and the link stays live for 3 days. A free account raises that to 20 GB per transfer with links that stay live for 7 days, and gives you 40 GB of storage; paid plans go up to 500 GB per transfer with no expiry date on the link.\",\"How large a file can I send?\",\"Up to 10 GB per transfer without an account, 20 GB on the free plan, 250 GB on Pro and 500 GB on Pro+. There is no file type restriction — video, archives, design files and raw footage all go through the same way.\",\"q6\",\"How long do my files stay online?\",\"a6\",\"Seven days on the free plan and three days for anonymous uploads, counted from the moment the upload finishes. On Pro and Pro+ links do not expire on their own, and you can set an expiry date yourself when you want one.\",\"q7\",\"Is LimeWire free?\",\"a7\",\"Yes, sharing files is free and stays free. Paid plans exist for people who need bigger transfers, more storage, longer-lived links and more AI credits — the full breakdown is on the pricing page.\",\"link7\",\"See all plans and prices\",\"q8\",\"What happened to the original LimeWire?\",\"a8\",\"A US court ordered the file-sharing features switched off on 26 October 2010, after a lawsuit brought by thirteen record companies in 2006. Lime Wire LLC settled in 2011 and no longer operates the brand: the LimeWire name was acquired in 2022 by a different company, which rebuilt the product from scratch as a web service. Nothing of the original peer-to-peer network was carried over.\",\"link8\",\"Read the full history of LimeWire, 2000 to today\",\"cta\",\"hintLine1\",\"Click or drag-and-drop\",\"hintLine2\",\"your files here\",\"folder\",\"titleHighlight\",\"Upload, edit and share\",\"titleRest\",\"files of any size\",\"Our end-to-end encrypted, AI-powered file sharing platform allows you to upload, manipulate \u0026 share files of any size, on any device.\",\"statsFiles\",\"Files Shared\",\"statsFilesValue\",\"131 Million\",\"statsUploaded\",\"Uploaded\",\"statsUploadedValue\",\"7.6 Petabyte\",\"statsRating\",\"Avg. Rating\",\"capterraNote\",\"Capterra Shortlist reports constitute the subjective opinions of individual end-user reviews, ratings and data applied against a documented methodology; they neither represent the views of, nor constitute an endorsement by, Capterra or its affiliates.\",\"rights\",\"All Rights Reserved.\",\"title\",\"LimeWire — Upload, edit and share files of any size\",\"description\",\"End-to-end encrypted file sharing with AI tools. Send files of any size from any device, no account needed to start.\",\"headingUpload\",\"Share files with LimeWire\",\"currency\",\"LMWR\",\"exchangeRate\",0.006193940012301945,\"percentageChange24h\",-3.84268827
