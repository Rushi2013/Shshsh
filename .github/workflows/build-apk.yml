# Unity Personal is activated online with the account email/password by GameCI v6.
# No .alf / .ulf file is needed. Run manually from the Actions tab.
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      host_only:
        description: "Only copy the latest APK into the repo for fast download"
        type: boolean
        default: false
      fetch_assets:
        description: "Fetch and stage an external asset bundle instead of building"
        type: boolean
        default: false
      url:
        description: "Direct asset ZIP URL (used when fetch_assets is true)"
        type: string
        default: ''
      target_dir:
        description: "Destination folder for fetched assets"
        type: string
        default: 'Assets/ImportedAssets/UniStormSky'
      probe_url:
        description: "Inspect a share/download page and commit its HTML for link discovery"
        type: string
        default: ''
      browser_url:
        description: "Share page to open in headless Chromium and download through"
        type: string
        default: ''
      browser_file:
        description: "Filename text to click (leave blank for Download all files)"
        type: string
        default: ''
      browser_target_dir:
        description: "Folder to commit downloaded file chunks into"
        type: string
        default: 'Assets/ImportedAssets/LimeWireDownloads'

permissions:
  contents: write
  actions: read

jobs:
  build-apk:
    if: ${{ !inputs.host_only && !inputs.fetch_assets && inputs.probe_url == '' && inputs.browser_url == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Build APK with Unity
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.62f3
          cliVersion: v0.1.77
          targetPlatform: Android
          buildMethod: ProjectSetup.BuildAndroid
          allowDirtyBuild: true

      - name: Save build diagnostics on failure
        if: failure()
        run: |
          {
            echo "Unity build diagnostics for run $GITHUB_RUN_ID"
            echo "Searching all Unity/editor log locations..."
            find / -type f \( -iname 'Editor.log' -o -iname '*editor*.log' -o -iname '*unity*.log' -o -name 'build.log' \) 2>/dev/null | head -80 | while read -r f; do
              echo "===== $f ($(stat -c%s "$f" 2>/dev/null) bytes) ====="
              grep -E "error CS|error:|Compilation failed|Exception|BuildFailed|failed" "$f" 2>/dev/null | tail -150 || tail -80 "$f" 2>/dev/null
            done
            echo "===== unity3d config tree ====="
            find /home/runner/.config/unity3d /root/.config/unity3d -maxdepth 4 -type f -printf '%p %s\n' 2>/dev/null | head -60
          } > build-diagnostics.txt
          head -c 200000 build-diagnostics.txt > build-diagnostics-small.txt
          mv build-diagnostics-small.txt build-diagnostics.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build-diagnostics.txt
          git commit -m "Upload Unity build diagnostics" || true
          git push || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CityDrive-APK
          path: build/**/*.apk
          if-no-files-found: error

      - name: Publish APK on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: city-drive-${{ github.run_number }}
          name: City Drive - Android APK
          body: |
            Unity-built Android APK of the open-world BMW city driving game.
            Download `CityDrive.apk` on your phone, enable "Install unknown apps", and install.
          files: build/**/*.apk

  host-apk:
    if: ${{ inputs.host_only && !inputs.fetch_assets && inputs.probe_url == '' && inputs.browser_url == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: arena/411eaf4f-shshsh

      - name: Download latest release APK
        run: |
          mkdir -p apk
          rm -f apk/CityDrive.apk
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "CityDrive.apk" --dir apk
          ls -lh apk/CityDrive.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit APK to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk/CityDrive.apk
          git commit -m "Host CityDrive APK for fast raw download" || true
          git push

  fetch-assets:
    if: ${{ inputs.fetch_assets && inputs.probe_url == '' && inputs.browser_url == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download external asset bundle
        env:
          ASSET_URL: ${{ inputs.url }}
        run: |
          set -euo pipefail
          if [ -z "${ASSET_URL}" ]; then
            echo "No asset URL supplied."
            exit 1
          fi
          mkdir -p /tmp/assetdl
          curl -L --fail --retry 3 --retry-delay 5 --connect-timeout 30 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36' \
            -e 'https://www.mediafire.com/' \
            -o /tmp/assetdl/bundle.zip "$ASSET_URL"
          ls -lh /tmp/assetdl/bundle.zip
          file /tmp/assetdl/bundle.zip

      - name: Inventory and stage sky/cloud subset
        env:
          TARGET_DIR: ${{ inputs.target_dir }}
          ASSET_URL: ${{ inputs.url }}
        run: |
          set -euo pipefail
          rm -rf /tmp/assetdl/extracted
          mkdir -p /tmp/assetdl/extracted
          unzip -q -o /tmp/assetdl/bundle.zip -d /tmp/assetdl/extracted

          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          src = Path('/tmp/assetdl/extracted')
          dst = Path(os.environ['TARGET_DIR'])
          url = os.environ.get('ASSET_URL', '<not supplied>')

          skip_suffixes = {'.zip', '.pdf', '.unitypackage', '.rar', '.7z', '.exe'}
          skip_parts = {'demo', 'demos', 'example', 'examples', 'documentation', 'docs', 'sample', 'samples'}
          per_file_limit = 25 * 1024 * 1024
          total_limit = 80 * 1024 * 1024

          all_files = []
          candidates = []
          for p in src.rglob('*'):
              if not p.is_file():
                  continue
              rel = p.relative_to(src)
              size = p.stat().st_size
              all_files.append((size, str(rel)))
              parts = {part.lower() for part in rel.parts}
              if p.suffix.lower() in skip_suffixes or parts & skip_parts:
                  continue
              if size > per_file_limit:
                  continue
              candidates.append((size, rel, p))

          all_files.sort(reverse=True)
          candidates.sort(key=lambda item: item[0])

          if dst.exists():
              shutil.rmtree(dst)
          dst.mkdir(parents=True, exist_ok=True)

          staged = []
          total = 0
          for size, rel, p in candidates:
              if total + size > total_limit:
                  continue
              out = dst / rel
              out.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(p, out)
              staged.append((size, str(rel)))
              total += size

          lines = [
              '# External asset bundle inventory',
              '',
              f'Source URL: {url}',
              f'ZIP size: {(Path("/tmp/assetdl/bundle.zip").stat().st_size / 1048576):.2f} MiB',
              f'Total extracted files: {len(all_files)}',
              f'Staged files: {len(staged)} ({(total / 1048576):.2f} MiB, cap 80 MiB / 25 MiB per file)',
              '',
              '## All files in ZIP (largest first)',
              '',
              '| Size (MiB) | Path |',
              '|---:|---|',
          ]
          for size, name in all_files:
              lines.append(f'| {size / 1048576:.2f} | `{name}` |')

          lines += ['', '## Staged into this branch', '']
          for size, name in sorted(staged, key=lambda item: item[1]):
              lines.append(f'- `{name}` ({(size / 1024):.1f} KiB)')

          (dst / 'INVENTORY.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(f'Staged {len(staged)} files, {total / 1048576:.2f} MiB into {dst}')
          PY

      - name: Probe inner container
        env:
          TARGET_DIR: ${{ inputs.target_dir }}
        run: |
          set -euo pipefail
          mkdir -p "$TARGET_DIR"
          {
            echo "Inner container probe"
            echo "7z available: $(command -v 7z || echo no)"
            for f in /tmp/assetdl/extracted/*; do
              echo "===== $f ====="
              file "$f" || true
              echo "----- first 96 bytes -----"
              xxd -l 96 "$f" || true
              echo "----- 7z listing -----"
              if command -v 7z >/dev/null 2>&1; then
                7z l "$f" 2>&1 | head -150 || true
              fi
              echo "----- unzip listing -----"
              unzip -l "$f" 2>&1 | head -150 || true
            done
          } > "$TARGET_DIR/INSPECT.txt"
          head -120 "$TARGET_DIR/INSPECT.txt"

      - name: Decompress inner gzip and probe payload
        env:
          TARGET_DIR: ${{ inputs.target_dir }}
        run: |
          set -euo pipefail
          f=$(find /tmp/assetdl/extracted -maxdepth 1 -type f | head -n 1)
          gzip -dc "$f" > /tmp/assetdl/inner.bin
          {
            echo "Decompressed payload probe"
            echo "Size: $(stat -c%s /tmp/assetdl/inner.bin) bytes"
            file /tmp/assetdl/inner.bin || true
            echo "----- first 512 bytes -----"
            xxd -l 512 /tmp/assetdl/inner.bin || true
            echo "----- strings from first 8 KiB -----"
            head -c 8192 /tmp/assetdl/inner.bin | strings | head -160 || true
            echo "----- tar listing attempt -----"
            tar tf /tmp/assetdl/inner.bin 2>&1 | head -100 || true
            echo "----- 7z listing attempt -----"
            7z l /tmp/assetdl/inner.bin 2>&1 | head -140 || true
            echo "----- embedded signature offsets -----"
            python3 - <<'PY'
          from pathlib import Path
          data = Path('/tmp/assetdl/inner.bin').read_bytes()[:20 * 1024 * 1024]
          for name, sig in [
              ('zip-local', b'PK\x03\x04'),
              ('zip-end', b'PK\x05\x06'),
              ('gzip', b'\x1f\x8b\x08'),
              ('ustar', b'ustar'),
              ('sevenzip', b'7z\xbc\xaf\x27\x1c'),
              ('rar4', b'Rar!'),
              ('rar5', b'Rar!\x1d\x07'),
          ]:
              offsets = []
              start = 0
              while len(offsets) < 5:
                  i = data.find(sig, start)
                  if i < 0:
                      break
                  offsets.append(i)
                  start = i + 1
              print(f'{name}: {offsets}')
          print('head-as-text:', repr(data[:300]))
          PY
          } > "$TARGET_DIR/INSPECT2.txt"
          head -160 "$TARGET_DIR/INSPECT2.txt"

      - name: Commit staged assets
        run: |
          set -euo pipefail
          git config user.name 'Arena Agent'
          git config user.email 'agent@users.noreply.github.com'
          git add -f "$TARGET_DIR"
          if git diff --cached --quiet; then
            echo "No new files to commit."
            exit 0
          fi
          git commit -m "Fetch and stage external sky/cloud asset bundle"
          git push origin HEAD:"$GITHUB_REF_NAME"
        env:
          TARGET_DIR: ${{ inputs.target_dir }}

  probe-url:
    if: ${{ inputs.probe_url != '' && inputs.browser_url == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Probe share page for direct download links
        env:
          PROBE_URL: ${{ inputs.probe_url }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/probe Assets/ImportedAssets/LimeWireProbe
          curl -sS -L --connect-timeout 30 --max-time 120 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36' \
            -D /tmp/probe/headers.txt -o /tmp/probe/page.html "$PROBE_URL"
          {
            echo "Probed URL: $PROBE_URL"
            echo "Final URL: $(curl -sS -L -o /dev/null -w '%{url_effective}' -A 'Mozilla/5.0' --max-time 60 "$PROBE_URL")"
            echo "HTML size: $(stat -c%s /tmp/probe/page.html) bytes"
            echo "===== headers ====="
            head -80 /tmp/probe/headers.txt || true
            echo "===== direct archive URLs ====="
            grep -oE 'https?[^"<> ]+\.(zip|rar|7z)[^"<> ]*' /tmp/probe/page.html | head -80 || true
            echo "===== download/api context ====="
            grep -oiE '.{0,140}(download|\.zip|\.rar|api/|cdn|bucket).{0,220}' /tmp/probe/page.html | head -160 || true
            echo "===== html head ====="
            head -c 12000 /tmp/probe/page.html || true
          } > Assets/ImportedAssets/LimeWireProbe/PROBE.txt
          cp /tmp/probe/page.html Assets/ImportedAssets/LimeWireProbe/page.html

          mkdir -p Assets/ImportedAssets/LimeWireProbe/js
          grep -oE '/build/(chunks|assets)/[^" ]+\.js' /tmp/probe/page.html \
            | sed 's/&amp;.*//' | sort -u | head -80 \
            | while read -r js; do
                name=$(printf '%s' "$js" | tr '/' '_')
                curl -sS --max-time 30 "https://limewire.com$js" \
                  -o "Assets/ImportedAssets/LimeWireProbe/js/$name" || true
              done
          echo "Downloaded JS chunks: $(find Assets/ImportedAssets/LimeWireProbe/js -type f | wc -l)"
          head -120 Assets/ImportedAssets/LimeWireProbe/PROBE.txt

      - name: Commit probe result
        run: |
          set -euo pipefail
          git config user.name 'Arena Agent'
          git config user.email 'agent@users.noreply.github.com'
          git add -f Assets/ImportedAssets/LimeWireProbe
          if git diff --cached --quiet; then
            echo "No probe changes."
            exit 0
          fi
          git commit -m "Probe LimeWire share page for direct links"
          git push origin HEAD:"$GITHUB_REF_NAME"

  browser-download:
    if: ${{ inputs.browser_url != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install playwright@latest >/dev/null
          npx playwright install --with-deps chromium

      - name: Download through the share page
        env:
          BROWSER_URL: ${{ inputs.browser_url }}
          BROWSER_FILE: ${{ inputs.browser_file }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/limewire
          cat > download.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const url = process.env.BROWSER_URL;
            const wanted = process.env.BROWSER_FILE || '';
            const browser = await chromium.launch({ headless: true, args: ['--no-sandbox'] });
            const context = await browser.newContext({
              acceptDownloads: true,
              viewport: { width: 1400, height: 1000 },
            });
            const page = await context.newPage();
            page.on('console', m => console.log('BROWSER:', m.text()));
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 120000 });
            await page.waitForTimeout(8000);

            for (const text of ['I Accept', 'Accept', 'Continue', 'Download anyway']) {
              try {
                const btn = page.getByRole('button', { name: text, exact: false }).first();
                if (await btn.isVisible({ timeout: 1500 })) {
                  await btn.click({ timeout: 3000 });
                }
              } catch (e) {
                // Not present; continue.
              }
            }

            const buttons = await page.locator('button').all();
            console.log('Buttons found:', buttons.length);
            let saved = false;
            for (const b of buttons) {
              let label = '';
              try { label = (await b.innerText({ timeout: 1000 })) || ''; } catch (e) {}
              console.log('BUTTON:', JSON.stringify(label.slice(0, 160)));
              const match = wanted ? label.includes(wanted) : label.includes('Download all');
              if (!match) continue;
              try {
                const [download] = await Promise.all([
                  page.waitForEvent('download', { timeout: 900000 }),
                  b.click({ timeout: 15000 }),
                ]);
                const name = download.suggestedFilename() || 'download.bin';
                const out = '/tmp/limewire/' + name;
                await download.saveAs(out);
                console.log('SAVED:', name, fs.statSync(out).size);
                saved = true;
                break;
              } catch (e) {
                console.log('CLICK_FAILED:', e.message);
              }
            }
            await browser.close();
            if (!saved) throw new Error('No matching download button produced a file');
          })().catch(e => { console.error('FATAL', e.message); process.exit(1); });
          JS
          node download.js

      - name: Chunk and commit downloaded file
        env:
          BROWSER_TARGET_DIR: ${{ inputs.browser_target_dir }}
        run: |
          set -euo pipefail
          file=$(find /tmp/limewire -type f | head -n 1)
          if [ -z "$file" ]; then
            echo "No downloaded file found."
            exit 1
          fi
          name=$(basename "$file")
          mkdir -p "$BROWSER_TARGET_DIR"
          {
            echo "name=$name"
            echo "size=$(stat -c%s "$file")"
            sha256sum "$file"
          } > "$BROWSER_TARGET_DIR/MANIFEST.txt"
          split -b 45m -d "$file" "$BROWSER_TARGET_DIR/$name.part-"
          ls -lh "$BROWSER_TARGET_DIR" | head -30

          git config user.name 'Arena Agent'
          git config user.email 'agent@users.noreply.github.com'
          git add -f "$BROWSER_TARGET_DIR"
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Fetch LimeWire share file via headless browser"
          git push origin HEAD:"$GITHUB_REF_NAME"
