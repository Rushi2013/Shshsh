# Unity Personal is activated online with the account email/password by GameCI v6.
# No .alf / .ulf file is needed. Run manually from the Actions tab.
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Build APK with Unity
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.62f3
          cliVersion: v0.1.77
          targetPlatform: Android
          buildMethod: ProjectSetup.BuildAndroid
          allowDirtyBuild: true

      - name: Publish failure details to the branch
        if: failure()
        run: |
          set +e
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/logs" -o /tmp/action-logs.zip
          rm -rf /tmp/action-logs && mkdir -p /tmp/action-logs
          unzip -o -q /tmp/action-logs.zip -d /tmp/action-logs
          LOG=$(find /tmp/action-logs -type f -name '*Build APK with Unity*.txt' | head -n 1)
          {
            echo '# Build failure details'
            echo '```'
            if [ -n "$LOG" ]; then
              grep -iE 'error CS|error:|exception|aborting|failed|could not|unable' "$LOG" | tail -n 60
              echo '--- build method marker ---'
              cat build_status.txt 2>/dev/null || echo 'BuildAndroid was never reached (script compilation likely failed).'
              echo '--- log tail ---'
              tail -n 80 "$LOG"
            else
              echo 'Unity step log not found in the downloaded archive.'
              ls -R /tmp/action-logs | tail -n 40
            fi
            echo '```'
          } > BUILD_ERROR.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_ERROR.md
          git commit -m "Publish APK build failure details" || true
          git push || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CityDrive-APK
          path: build/**/*.apk
          if-no-files-found: error

      - name: Publish APK on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: city-drive-${{ github.run_number }}
          name: City Drive - Android APK
          body: |
            Unity-built Android APK of the open-world BMW city driving game.
            Download `CityDrive.apk` on your phone, enable "Install unknown apps", and install.
          files: build/**/*.apk
