name: Build Android APK

# Run manually from the Actions tab after the three Unity secrets are added.
# See UNITY-LICENSE-GUIDE.md for where each secret comes from.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Download licence produced by the no-PC workflow
        uses: dawidd6/action-download-artifact@v28
        continue-on-error: true
        with:
          workflow: get-unity-license.yml
          workflow_conclusion: success
          name: UnityLicense
          path: license-in
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Export licence to the build environment
        run: |
          ULF=$(find license-in -name '*.ulf' -print -quit 2>/dev/null || true)
          if [ -n "$ULF" ]; then
            {
              echo 'UNITY_LICENSE<<EOF'
              cat "$ULF"
              echo 'EOF'
            } >> "$GITHUB_ENV"
            echo "Using licence from the UnityLicense artifact"
          else
            echo "No licence artifact found; falling back to the UNITY_LICENSE secret"
          fi

      - name: Build APK with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE || secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.62f3
          targetPlatform: Android
          buildMethod: ProjectSetup.BuildAndroid
          allowDirtyBuild: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CityDrive-APK
          path: build/*.apk
          if-no-files-found: error

      - name: Publish APK on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: city-drive-${{ github.run_number }}
          name: City Drive - Android APK
          body: |
            Unity-built Android APK of the open-world BMW city driving game.
            Download `CityDrive.apk` on your phone, enable "Install unknown apps", and install.
          files: build/*.apk
