# Unity Personal is activated online with the account email/password by GameCI v6.
# No .alf / .ulf file is needed. Run manually from the Actions tab.
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      host_only:
        description: "Only copy the latest APK into the repo for fast download"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  build-apk:
    if: ${{ !inputs.host_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Build APK with Unity
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.62f3
          cliVersion: v0.1.77
          targetPlatform: Android
          buildMethod: ProjectSetup.BuildAndroid
          allowDirtyBuild: true

      - name: Save build diagnostics on failure
        if: failure()
        run: |
          {
            echo "Unity build diagnostics for run $GITHUB_RUN_ID"
            echo "Searching common editor log locations..."
            find /home/runner /tmp /github -type f \( -iname '*editor*.log' -o -iname '*unity*.log' -o -name 'build.log' \) 2>/dev/null | head -40 | while read -r f; do
              echo "===== $f ====="
              grep -E "error CS|error:|Compilation failed|Exception|BuildFailed|failed" "$f" 2>/dev/null | tail -120 || tail -80 "$f" 2>/dev/null
            done
          } > build-diagnostics.txt
          head -c 200000 build-diagnostics.txt > build-diagnostics-small.txt
          mv build-diagnostics-small.txt build-diagnostics.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build-diagnostics.txt
          git commit -m "Upload Unity build diagnostics" || true
          git push || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CityDrive-APK
          path: build/**/*.apk
          if-no-files-found: error

      - name: Publish APK on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: city-drive-${{ github.run_number }}
          name: City Drive - Android APK
          body: |
            Unity-built Android APK of the open-world BMW city driving game.
            Download `CityDrive.apk` on your phone, enable "Install unknown apps", and install.
          files: build/**/*.apk

  host-apk:
    if: ${{ inputs.host_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: arena/411eaf4f-shshsh

      - name: Download latest release APK
        run: |
          mkdir -p apk
          rm -f apk/CityDrive.apk
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "CityDrive.apk" --dir apk
          ls -lh apk/CityDrive.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit APK to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk/CityDrive.apk
          git commit -m "Host CityDrive APK for fast raw download" || true
          git push
