# Unity Personal is activated online with the account email/password by GameCI v6.
# No .alf / .ulf file is needed. Run manually from the Actions tab.
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      host_only:
        description: "Only copy the latest APK into the repo for fast download"
        type: boolean
        default: false
      inspect_rcc:
        description: "Inspect the uploaded Realistic Car Controller RAR and commit an inventory"
        type: boolean
        default: false
      stage_rcc:
        description: "Stage RCC dashboard/speedometer textures into Resources"
        type: boolean
        default: false
      stage_rccp:
        description: "Stage RCC Pro smoke prefabs, textures and materials"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  build-apk:
    if: ${{ !inputs.host_only && !inputs.inspect_rcc && !inputs.stage_rcc && !inputs.stage_rccp }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Build APK with Unity
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 2022.3.62f3
          cliVersion: v0.1.77
          targetPlatform: Android
          buildMethod: ProjectSetup.BuildAndroid
          allowDirtyBuild: true

      - name: Save build diagnostics on failure
        if: failure()
        run: |
          {
            echo "Unity build diagnostics for run $GITHUB_RUN_ID"
            echo "Searching all Unity/editor log locations..."
            find / -type f \( -iname 'Editor.log' -o -iname '*editor*.log' -o -iname '*unity*.log' -o -name 'build.log' \) 2>/dev/null | head -80 | while read -r f; do
              echo "===== $f ($(stat -c%s "$f" 2>/dev/null) bytes) ====="
              grep -E "error CS|error:|Compilation failed|Exception|BuildFailed|failed" "$f" 2>/dev/null | tail -150 || tail -80 "$f" 2>/dev/null
            done
            echo "===== unity3d config tree ====="
            find /home/runner/.config/unity3d /root/.config/unity3d -maxdepth 4 -type f -printf '%p %s\n' 2>/dev/null | head -60
          } > build-diagnostics.txt
          head -c 200000 build-diagnostics.txt > build-diagnostics-small.txt
          mv build-diagnostics-small.txt build-diagnostics.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build-diagnostics.txt
          git commit -m "Upload Unity build diagnostics" || true
          git push || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CityDrive-APK
          path: build/**/*.apk
          if-no-files-found: error

      - name: Publish APK on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: city-drive-${{ github.run_number }}
          name: City Drive - Android APK
          body: |
            Unity-built Android APK of the open-world BMW city driving game.
            Download `CityDrive.apk` on your phone, enable "Install unknown apps", and install.
          files: build/**/*.apk

  host-apk:
    if: ${{ inputs.host_only && !inputs.inspect_rcc && !inputs.stage_rcc && !inputs.stage_rccp }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: arena/411eaf4f-shshsh

      - name: Download latest release APK
        run: |
          mkdir -p apk
          rm -f apk/CityDrive.apk
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "CityDrive.apk" --dir apk
          ls -lh apk/CityDrive.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit APK to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk/CityDrive.apk
          git commit -m "Host CityDrive APK for fast raw download" || true
          git push

  inspect-rcc:
    if: ${{ inputs.inspect_rcc && !inputs.stage_rcc && !inputs.stage_rccp }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install RAR tool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full

      - name: Reassemble and inventory RCC
        run: |
          set -euo pipefail
          D='Assets/ImportedAssets/UniStormDownload'
          mkdir -p /tmp/rcc
          cat "$D/Realistic Car Controller v3.70.rar.part01" \
              "$D/Realistic Car Controller v3.70.rar.part02" \
              "$D/Realistic Car Controller v3.70.rar.part03" \
              "$D/Realistic Car Controller v3.70.rar.part04" \
              "$D/Realistic Car Controller v3.70.rar.part05" \
              "$D/Realistic Car Controller v3.70.rar.part06" \
              "$D/Realistic Car Controller v3.70.rar.part07" > /tmp/rcc/RCC.rar
          7z x -y -o/tmp/rcc /tmp/rcc/RCC.rar >/dev/null
          PKG=$(find /tmp/rcc -name '*.unitypackage' | head -1)
          gzip -dc "$PKG" > /tmp/rcc/RCC.tar
          mkdir -p /tmp/rcc_pkg
          tar xf /tmp/rcc/RCC.tar -C /tmp/rcc_pkg
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/rcc_pkg')
          rows=[]
          for d in root.iterdir():
              pn=d/'pathname'
              a=d/'asset'
              if not pn.exists(): continue
              p=pn.read_text(errors='ignore').splitlines()[0].strip()
              rows.append((a.stat().st_size if a.exists() else 0,p))
          rows.sort(reverse=True)
          lines=['# Realistic Car Controller v3.70 package inventory','',f'Files: {len(rows)}','', '| KiB | Path |','|---:|---|']
          for s,p in rows:
              lines.append(f'| {s/1024:.1f} | `{p}` |')
          Path('Assets/ImportedAssets/UniStormDownload/RCC-INVENTORY.md').write_text('\n'.join(lines)+'\n')
          print('inventory entries',len(rows))
          PY
          head -30 Assets/ImportedAssets/UniStormDownload/RCC-INVENTORY.md

      - name: Commit inventory
        run: |
          set -euo pipefail
          git config user.name 'Arena Agent'
          git config user.email 'agent@users.noreply.github.com'
          git add -f Assets/ImportedAssets/UniStormDownload/RCC-INVENTORY.md
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m "Add RCC package inventory"
          git push origin HEAD:"$GITHUB_REF_NAME"

  stage-rcc:
    if: ${{ inputs.stage_rcc && !inputs.stage_rccp }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install RAR tool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full

      - name: Stage RCC dashboard textures
        run: |
          set -euo pipefail
          D='Assets/ImportedAssets/UniStormDownload'
          mkdir -p /tmp/rcc Assets/Resources/UI/RCC
          cat "$D/Realistic Car Controller v3.70.rar.part01" \
              "$D/Realistic Car Controller v3.70.rar.part02" \
              "$D/Realistic Car Controller v3.70.rar.part03" \
              "$D/Realistic Car Controller v3.70.rar.part04" \
              "$D/Realistic Car Controller v3.70.rar.part05" \
              "$D/Realistic Car Controller v3.70.rar.part06" \
              "$D/Realistic Car Controller v3.70.rar.part07" > /tmp/rcc/RCC.rar
          7z x -y -o/tmp/rcc /tmp/rcc/RCC.rar >/dev/null
          PKG=$(find /tmp/rcc -name '*.unitypackage' | head -1)
          gzip -dc "$PKG" > /tmp/rcc/RCC.tar
          mkdir -p /tmp/rcc_pkg
          tar xf /tmp/rcc/RCC.tar -C /tmp/rcc_pkg
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('/tmp/rcc_pkg')
          dest=Path('Assets/Resources/UI/RCC')
          wanted={
            'Speedometer.png','Needle.png','RPMMeter.png','RPMTop.png',
            'Tachometer.png','Background.tif','TachometerNeedle.png'
          }
          dirs={}
          for d in root.iterdir():
              pn=d/'pathname'
              if not pn.exists(): continue
              p=pn.read_text(errors='ignore').splitlines()[0].strip()
              if Path(p).name in wanted:
                  dirs[Path(p).name]=d
          for name,d in dirs.items():
              a=d/'asset'; m=d/'asset.meta'
              if a.exists(): shutil.copy2(a, dest/name)
              if m.exists(): shutil.copy2(m, Path(str(dest/name)+'.meta'))
              print('staged',name)
          PY
          ls -lh Assets/Resources/UI/RCC

      - name: Commit staged textures
        run: |
          set -euo pipefail
          git config user.name 'Arena Agent'
          git config user.email 'agent@users.noreply.github.com'
          git add -f Assets/Resources/UI/RCC
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m "Stage RCC speedometer textures from user archive"
          git push origin HEAD:"$GITHUB_REF_NAME"

  stage-rccp:
    if: ${{ inputs.stage_rccp }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install RAR tool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full

      - name: Reassemble and stage RCC Pro smoke assets
        run: |
          set -euo pipefail
          D='Assets/ImportedAssets/UniStormDownload'
          mkdir -p /tmp/rccp
          cat "$D/Realistic Car Controller Pro v1.44.0.rar.part01" \
              "$D/Realistic Car Controller Pro v1.44.0.rar.part02" \
              "$D/Realistic Car Controller Pro v1.44.0.rar.part03" \
              "$D/Realistic Car Controller Pro v1.44.0.rar.part04" \
              "$D/Realistic Car Controller Pro v1.44.0.rar.part05" > /tmp/rccp/RCCP.rar
          sha256sum /tmp/rccp/RCCP.rar
          7z x -y -o/tmp/rccp /tmp/rccp/RCCP.rar >/dev/null
          PKG=$(find /tmp/rccp -name '*.unitypackage' | head -1)
          gzip -dc "$PKG" > /tmp/rccp/RCCP.tar
          mkdir -p /tmp/rccp_pkg
          tar xf /tmp/rccp/RCCP.tar -C /tmp/rccp_pkg
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('/tmp/rccp_pkg')
          dest=Path('/home/user/Shshsh/Assets/Realistic Car Controller Pro')
          rows=[]
          staged=0
          for d in root.iterdir():
              pn=d/'pathname'
              if not pn.exists(): continue
              p=pn.read_text(errors='ignore').splitlines()[0].strip()
              a=d/'asset'
              rows.append((a.stat().st_size if a.exists() else 0,p))
              if not p.startswith('Assets/Realistic Car Controller Pro/'): continue
              rel=p[len('Assets/Realistic Car Controller Pro/'):]
              wanted = (
                  rel.startswith('Prefabs/Particles/') or
                  rel.startswith('Textures/Particles/') or
                  rel.startswith('Materials/Particle Materials/') or
                  rel.startswith('Prefabs/Skidmarks/')
              )
              if not wanted: continue
              if a.exists():
                  target=dest/rel
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(a,target)
                  m=d/'asset.meta'
                  if m.exists(): shutil.copy2(m, Path(str(target)+'.meta'))
                  staged+=1
          rows.sort(reverse=True)
          lines=['# RCC Pro package inventory','',f'Files: {len(rows)}','', '| KiB | Path |','|---:|---|']
          for size,path in rows:
              lines.append(f'| {size/1024:.1f} | `{path}` |')
          Path('Assets/ImportedAssets/UniStormDownload/RCCP-INVENTORY.md').write_text('\n'.join(lines)+'\n')
          print('staged',staged,'smoke files')
          PY
          du -sh 'Assets/Realistic Car Controller Pro'
          grep -iE 'WheelSlip|BurnoutSmoke|Smoke.png' Assets/ImportedAssets/UniStormDownload/RCCP-INVENTORY.md | head -20

      - name: Commit staged RCC Pro assets
        run: |
          set -euo pipefail
          git config user.name 'Arena Agent'
          git config user.email 'agent@users.noreply.github.com'
          git add -f 'Assets/Realistic Car Controller Pro' Assets/ImportedAssets/UniStormDownload/RCCP-INVENTORY.md
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m "Stage RCC Pro smoke prefabs and textures from user archive"
          git push origin HEAD:"$GITHUB_REF_NAME"
