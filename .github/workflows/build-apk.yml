# Unity Personal is activated online with the account email/password by GameCI v6.
# No .alf / .ulf file is needed. Run manually from the Actions tab.
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Build APK with Unity
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.62f3
          cliVersion: v0.1.77
          targetPlatform: Android
          buildMethod: ProjectSetup.BuildAndroid
          allowDirtyBuild: true

      - name: Publish failure log to the branch
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/logs" -o /tmp/run-logs.zip || true
          {
            echo "# Build failure details"
            echo ""
            echo '```'
            if [ -s /tmp/run-logs.zip ]; then
              unzip -p /tmp/run-logs.zip 2>/dev/null | grep -iE 'error|exception|failed|cs\(|licen|warn' | tail -150 || true
            else
              echo "Could not download logs."
            fi
            echo '```'
          } > BUILD_ERROR.md
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git add BUILD_ERROR.md
          git commit -m "chore: publish build error log" || echo "no changes to commit"
          git push origin "HEAD:$GITHUB_REF_NAME" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CityDrive-APK
          path: build/*.apk
          if-no-files-found: error

      - name: Publish APK on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: city-drive-${{ github.run_number }}
          name: City Drive - Android APK
          body: |
            Unity-built Android APK of the open-world BMW city driving game.
            Download `CityDrive.apk` on your phone, enable "Install unknown apps", and install.
          files: build/*.apk
