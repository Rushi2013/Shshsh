name: Host APK for fast download

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  host-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: arena/411eaf4f-shshsh

      - name: Download latest release APK
        run: |
          mkdir -p apk
          rm -f apk/CityDrive.apk
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "CityDrive.apk" --dir apk
          ls -lh apk/CityDrive.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit APK to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk/CityDrive.apk
          git commit -m "Host CityDrive APK for fast raw download" || true
          git push
